name: Gemini 2.0 Code Reviewer

on:
  pull_request:
    branches:
      - dev

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @google/generative-ai

      - name: Get Code Diff
        id: diff
        run: |
          # Lấy diff giữa nhánh hiện tại và nhánh dev
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          # Kiểm tra nếu file diff quá lớn (Gemini 2.0 chịu được nhưng nên tránh file rác)
          if [ ! -s diff.txt ]; then
            echo "EMPTY_DIFF=true" >> $GITHUB_ENV
          fi

      - name: Run Gemini 2.0 Review
        if: env.EMPTY_DIFF != 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          node -e "
          const { GoogleGenerativeAI } = require('@google/generative-ai');
          const fs = require('fs');

          async function run() {
            try {
              const genAI = new GoogleGenerativeAI(process.env.GOOGLE_API_KEY);
              
              // Sử dụng model Gemini 2.0 Flash Lite
              // Nếu bị 404, hãy thử: 'gemini-2.0-flash-lite-preview-02-05'
              const model = genAI.getGenerativeModel({ model: 'gemini-2.0-flash-lite' });

              const diff = fs.readFileSync('diff.txt', 'utf8');

              const prompt = \`
              Bạn là một Senior Backend Engineer review code cho dự án ExpressJS + TypeScript Modular.
              Nhiệm vụ: Review file diff dưới đây và đưa ra đánh giá.

              Quy tắc cấu trúc dự án:
              - Phải tách biệt: Controller (vào/ra), Service (logic nghiệp vụ), Repository (truy vấn DB).
              - Dùng Interface/Type cho mọi dữ liệu, không dùng 'any'.
              - Error Handling phải tập trung, không lạm dụng console.log.
              - Tuân thủ chuẩn RESTful API.
              - Phải kiểm tra và validate dữ liệu đầu vào.
              - Phải kiểm tra middleware xác thực/ủy quyền.

              Yêu cầu định dạng phản hồi:
              1. **Tổng quan**: (Ngắn gọn)
              2. **Điểm tốt**: (Nếu có)
              3. **Vấn đề & Giải pháp**: Liệt kê các lỗi kèm code ví dụ để fix.

              Nội dung diff:
              \\\n\\\`\\\`\\\`diff\\\n\${diff}\\\n\\\`\\\`\\\`
              \`;

              const result = await model.generateContent(prompt);
              const response = await result.response;
              fs.writeFileSync('review_result.md', response.text());
            } catch (error) {
              console.error(error);
              fs.writeFileSync('review_result.md', '❌ Error during AI Review: ' + error.message);
              process.exit(1);
            }
          }
          run();
          "

      - name: Create Review Issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('review_result.md')) return;
            const body = fs.readFileSync('review_result.md', 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🛡️ Review Code PR #${context.issue.number} (Gemini 2.0)`,
              body: `Kết quả review tự động cho PR này:\n\n${body}`,
              labels: ['ai-review']
            });